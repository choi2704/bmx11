<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BMX11 훈련 · 회계 관리</title>
<style>
:root{--blue:#1769e0;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6d778a;--line:#e7ebf2;--green:#12a05c;--yellow:#f3aa18;--red:#ed4d4d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:680px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:86px}.top{position:sticky;top:0;z-index:4;background:#fff;padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px;color:var(--blue)}button{font:inherit;border:0;cursor:pointer}.pill,.btn{border-radius:12px;padding:11px 14px;font-weight:750}.btn{background:var(--blue);color:#fff}.ghost{background:#eef4ff;color:var(--blue)}.danger{background:#fff0f0;color:var(--red)}
main{padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #1b37610a}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.muted{color:var(--muted);font-size:13px}.big{font-size:25px;font-weight:900}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.tab{background:none;padding:8px 2px;color:#687386;font-size:12px}.tab b{display:block;font-size:20px;margin-bottom:3px}.tab.on{color:var(--blue)}
.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:12px;color:#7a8496;padding:5px}.day{min-height:78px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px;font-size:12px;text-align:left}.day.weekend{background:#fbfcff}.day.has{border:2px solid #b9d3ff}.day .date{font-weight:800}.day .info{font-size:10px;margin-top:8px;color:var(--blue);line-height:1.35}.section-title{font-size:18px;font-weight:900;margin:4px 0 12px}
input,textarea,select{width:100%;border:1px solid #dfe4ec;border-radius:11px;padding:11px;background:#fff;font:inherit}textarea{min-height:78px;resize:vertical}.form{display:grid;gap:9px}.status{display:grid;grid-template-columns:1fr repeat(3,62px);gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.status button{padding:8px 3px;border-radius:9px;background:#f3f5f8;font-size:12px}.status .g.on{background:#dff7e9;color:#087c44}.status .y.on{background:#fff0c9;color:#9a6500}.status .r.on{background:#ffe1e1;color:#b62424}.receipt{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.ledger{padding:10px 0;border-bottom:1px solid var(--line)}.money.in{color:var(--green)}.money.out{color:var(--red)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary>div{border-radius:13px;padding:12px 8px;text-align:center;background:#f6f8fc}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:28px 5px}.comment{padding:10px 0;border-bottom:1px solid var(--line)}.comment-actions{display:flex;gap:6px;margin-top:7px}.comment-actions button{padding:5px 9px;border-radius:8px;font-size:12px}.notice-photo{width:100%;max-height:260px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-top:8px}.expense-total{font-size:22px;font-weight:900;color:var(--red)}.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.check-item{border:1px solid #dfe4ec;border-radius:10px;padding:10px;background:#fff}.check-item input{width:auto;margin-right:6px}.badge{font-size:12px;padding:5px 8px;border-radius:99px;background:#edf3ff;color:var(--blue)}.finance-day{min-height:66px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:11px;text-align:left}.finance-day .date{font-weight:800}.finance-day .fin-in{color:var(--green);font-size:9px;margin-top:4px;line-height:1.2}.finance-day .fin-out{color:var(--red);font-size:9px;line-height:1.2}.finance-day.has{border-color:#b9d3ff}.finance-day.on{outline:2px solid var(--blue);background:#f3f7ff}.receipt-link{display:inline-block;margin-top:6px}.finance-filter{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.finance-filter button{padding:8px 11px;border-radius:10px}.finance-filter .on{background:var(--blue);color:#fff}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:120;background:#14213d;color:#fff;padding:12px 16px;border-radius:12px;font-weight:800;box-shadow:0 6px 24px #0003;max-width:90%;text-align:center}.receipt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.receipt-card{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fafbfe}.receipt-card img{width:100%;height:76px;object-fit:cover;border-radius:8px}.receipt-zoom{display:block;width:100%;padding:0;border:0;background:transparent;cursor:zoom-in}.receipt-viewer{position:fixed;inset:0;z-index:2147483000;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;padding:70px 10px 34px;overflow:hidden}.receipt-viewer-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch}.receipt-viewer img{display:block;max-width:96vw;max-height:calc(100vh - 118px);width:auto;height:auto;object-fit:contain;border:0;background:#fff;box-shadow:0 3px 18px #0008;touch-action:pan-x pan-y pinch-zoom}.receipt-viewer-close{position:fixed;top:12px;top:max(12px,env(safe-area-inset-top));right:12px;z-index:2147483647;width:48px;height:48px;min-width:48px;padding:0;border:2px solid #fff;border-radius:50%;background:#111;color:#fff;font-size:30px;font-weight:500;line-height:42px;text-align:center;box-shadow:0 2px 12px #0008}.receipt-viewer-hint{position:fixed;left:50%;bottom:12px;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:2147483646;color:#fff;font-size:12px;background:#000b;padding:7px 10px;border-radius:999px;white-space:nowrap;pointer-events:none}.receipt-viewer-error{color:#fff;text-align:center;padding:24px;font-size:15px}.receipt-card a{font-size:12px;word-break:break-all}.receipt-amount{margin-top:6px;font-weight:800;color:var(--red)}
@media(max-width:440px){main{padding:12px}.day{min-height:68px;padding:5px}.day .info{font-size:9px}.status{grid-template-columns:1fr repeat(3,55px)}}
</style>
</head>
<body><div class="app"><header class="top"><div><div class="brand">BMX11</div><div class="muted">주말 훈련 관리</div></div><span class="badge">개인 관리</span></header><main id="main"></main>
<nav class="tabs">
<button class="tab on" data-view="calendar"><b>📅</b>달력</button>
<button class="tab" data-view="members"><b>👥</b>명단</button>
<button class="tab" data-view="finance"><b>💳</b>납부·회계</button>
<button class="tab" data-view="settings"><b>⚙️</b>설정</button>
</nav></div>
<script>
const K='bmx11_final_v1';
const seed={members:[],trainings:{},ledger:[],payments:{},comments:{}};
let db=JSON.parse(localStorage.getItem(K)||'null')||JSON.parse(JSON.stringify(seed)), view='calendar', selected=null;
let financeMonth=todayMonth(), financeSelected='';
// 기존 브라우저에 입력된 데이터는 절대 초기화하지 않고, 새 필드만 보완합니다.
db.members=db.members||[];db.trainings=db.trainings||{};db.ledger=db.ledger||[];db.payments=db.payments||{};db.comments=db.comments||{};
Object.values(db.trainings).forEach(t=>{t.attendance=t.attendance||{};t.expenses=t.expenses||[];t.noticeImages=t.noticeImages||[]});
function save(){
  try{localStorage.setItem(K,JSON.stringify(db));return true}
  catch(e){
    console.error(e);
    alert('저장공간이 부족해서 저장하지 못했습니다. 영수증 사진 수를 줄이거나 백업 후 오래된 큰 사진을 정리해주세요.');
    return false;
  }
}
const el=()=>document.getElementById('main');
function money(n){return Number(n||0).toLocaleString('ko-KR')+'원'} function todayMonth(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`} let month=todayMonth();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;selected=null;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});
function render(){if(view==='calendar') calendar(); if(view==='members') members(); if(view==='finance') finance(); if(view==='settings') settings()}
function calendar(){if(selected)return detail(selected); let [y,m]=month.split('-').map(Number), first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,t=db.trainings[ds],wk=[0,6].includes(new Date(y,m-1,d).getDay());cells+=`<button class="day ${wk?'weekend':''} ${t?'has':''}" onclick="selected='${ds}';render()"><div class=date>${d}</div>${t?`<div class=info>${t.time||''}<br>${t.place||''}</div>`:''}</button>`} el().innerHTML=`<div class=month><button class="pill ghost" onclick="shift(-1)">‹</button><div class=big>${y}년 ${m}월</div><button class="pill ghost" onclick="shift(1)">›</button></div><div class=calendar>${['일','월','화','수','목','금','토'].map(x=>`<div class=dow>${x}</div>`).join('')}${cells}</div><button class="btn" style="width:100%;margin-top:14px" onclick="newTraining()">+ 훈련 일정 추가</button>`}
function shift(n){
  const [y,m] = month.split('-').map(Number);
  const totalMonths = y * 12 + (m - 1) + n;
  const newYear = Math.floor(totalMonths / 12);
  const newMonth = ((totalMonths % 12) + 12) % 12 + 1;
  month = `${newYear}-${String(newMonth).padStart(2,'0')}`;
  render();
}
function newTraining(){let d=prompt('훈련 날짜를 입력하세요. 예: 2026-10-10');if(d){db.trainings[d]=db.trainings[d]||{time:'10:00 ~ 13:00',place:'',notice:'',important:'',attendance:{},expenses:[],noticeImages:[]};save();selected=d;render()}}
function detail(d){
  let t=db.trainings[d]||(db.trainings[d]={time:'',place:'',notice:'',important:'',attendance:{},expenses:[],noticeImages:[]});
  t.attendance=t.attendance||{};t.expenses=t.expenses||[];t.noticeImages=t.noticeImages||[];
  let kids=db.members.filter(x=>x.role==='child');
  let possible=kids.filter(x=>t.attendance[x.id]==='g').length;
  let rows=db.members.map(x=>`<div class=status><div><b>${x.name}</b><div class=muted>${x.role==='coach'?'코치':'아이'}</div></div>${['g','y','r'].map((s,i)=>`<button class="${s} ${t.attendance[x.id]===s?'on':''}" onclick="att('${d}','${x.id}','${s}')">${['가능','조정','불가'][i]}</button>`).join('')}</div>`).join('');
  let totalExpense=t.expenses.reduce((a,x)=>a+Number(x.amount||0),0);
  let ex=t.expenses.map((x,i)=>{let rs=(x.receipts&&x.receipts.length)?x.receipts:(x.image?[{name:'영수증',data:x.image,type:String(x.image).startsWith('data:image/')?'image/':'',amount:x.amount||0}]:[]);return `<div class="ledger row between"><div style="min-width:0;flex:1"><b>${x.category}</b><div class=muted>${x.memo||''}</div>${rs.length?`<div class=receipt-grid>${rs.map(receiptPreviewHtml).join('')}</div>`:''}</div><div style="text-align:right;white-space:nowrap"><b class="money out">-${money(x.amount)}</b><br><button class="pill ghost" style="margin-top:7px;padding:6px 9px" onclick="editExpense('${d}',${i})">수정</button> <button class="pill danger" style="margin-top:7px;padding:6px 9px" onclick="deleteExpense('${d}',${i})">삭제</button></div></div>`}).join('');
  let noticePhotos=t.noticeImages.map((src,i)=>`<div style="position:relative"><img class=notice-photo src="${src}" onclick="window.open(this.src)"><button class="pill danger" style="position:absolute;right:8px;top:16px;padding:5px 8px" onclick="removeNoticePhoto('${d}',${i})">삭제</button></div>`).join('');
  let comments=(db.comments[d]||[]).map((x,i)=>`<div class=comment><b>${x.author}</b><div>${escapeHtml(x.text)}</div><div class=comment-actions><button class=ghost onclick="editComment('${d}',${i})">수정</button><button class=danger onclick="deleteComment('${d}',${i})">삭제</button></div></div>`).join('');
  el().innerHTML=`<button class="pill ghost" onclick="selected=null;render()">← 달력</button><h2>${d} 훈련</h2>
<div class=card><div class=form><label>훈련 시간<input value="${t.time||''}" onchange="field('${d}','time',this.value)"></label><label>훈련 장소<input value="${t.place||''}" onchange="field('${d}','place',this.value)"></label></div></div>
<div class=card><div class=section-title>📣 코치 공지 / 중요내용</div><textarea placeholder="공지사항" onchange="field('${d}','notice',this.value)">${t.notice||''}</textarea><textarea style="margin-top:8px" placeholder="집합시간, 준비물 등 중요내용" onchange="field('${d}','important',this.value)">${t.important||''}</textarea><label class="pill ghost" style="display:block;text-align:center;margin-top:10px;cursor:pointer">📷 공지 사진 올리기<input type=file accept="image/*" multiple style="display:none" onchange="addNoticePhotos('${d}',this.files);this.value='' "></label>${noticePhotos}</div>
<div class=card><div class="row between"><div class=section-title>👥 참석 현황</div><b>아이 가능 ${possible}명 / ${kids.length}명</b></div>${rows}</div>
<div class=card><div class="row between"><div><div class=section-title>💰 비용</div><div class=expense-total>${money(totalExpense)}</div></div><button class=btn onclick="addExpense('${d}')">+ 지출</button></div>${ex||'<div class=empty>등록된 지출이 없습니다.</div>'}</div>
<div class=card><div class=section-title>💬 댓글</div>${comments}<div class="row" style="margin-top:10px"><input id=comment placeholder="댓글 입력"><button class=btn onclick="comment('${d}')">등록</button></div></div>`
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(d,k,v){db.trainings[d][k]=v;save()} function att(d,id,s){db.trainings[d].attendance[id]=s;save();render()}
function addNoticePhotos(d,files){
  if(!files||!files.length)return;
  const list=[...files]; let done=0;
  list.forEach(f=>{let r=new FileReader();r.onload=()=>{db.trainings[d].noticeImages.push(r.result);done++;if(done===list.length){save();render()}};r.readAsDataURL(f)});
}
function removeNoticePhoto(d,i){if(!confirm('이 공지 사진을 삭제할까요?'))return;db.trainings[d].noticeImages.splice(i,1);save();render()}
function addExpense(d){showExpenseForm(d,null)}
function editExpense(d,i){showExpenseForm(d,i)}
function showExpenseForm(d,index){
  const cats=['간식비','숙박비','코칭비','식대','트랙 입장료','교통·차량비','기타'];
  const old=index===null?null:db.trainings[d].expenses[index];
  const existing=(old?.receipts&&old.receipts.length)?old.receipts.map(x=>({...x})):
    (old?.image?[{name:'기존 영수증',data:old.image,type:String(old.image).startsWith('data:image/')?'image/':'',amount:Number(old.amount||0),ocrStatus:'manual'}]:[]);
  const wrap=document.createElement('div');wrap.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:flex;align-items:flex-end;justify-content:center';
  wrap.innerHTML=`<div style="background:white;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px"><div class="row between"><div class=section-title>${old?'✏️ 지출 수정':'💳 지출 등록'}</div><button class="pill ghost" id=closeExpense>닫기</button></div><div class=form>
  <div><b>지출 항목</b><div class=muted>체크박스로 선택하세요. 여러 항목도 가능합니다.</div><div class=check-grid style="margin-top:8px">${cats.map(c=>`<label class=check-item><input type=checkbox class=expCat value="${c}" ${(old&&(old.category||'').split(' + ').includes(c))?'checked':''}>${c}</label>`).join('')}</div><input id=expOther placeholder="기타 항목 직접 입력" style="margin-top:8px"></div>
  <div class=card style="margin:0">
    <b>🧾 영수증 사진</b>
    <div class=muted style="margin:5px 0 9px">여러 장을 한 번에 선택할 수 있습니다. 한 장만 선택되는 기기에서는 다시 눌러 추가하면 기존 사진에 계속 누적됩니다. 사진을 올리면 금액을 자동 인식해 합산합니다.</div>
    <input id=expReceipts type=file accept="image/*" multiple style="padding:9px;background:#fff">
    <div id=expReceiptStatus class=muted style="margin-top:7px">선택된 영수증 ${existing.length}장</div>
    <div id=expReceiptInputs style="display:grid;gap:8px;margin-top:10px"></div>
  </div>
  <label>영수증 외 추가 금액<input id=expExtra type=number inputmode=numeric value="${existing.length?0:(old?.amount||'')}" placeholder="영수증 없는 비용이 있으면 입력"></label>
  <div class=card style="margin:0"><div class="row between"><b>이번 지출 합계</b><b class=big id=expTotal>${money(old?old.amount:0)}</b></div><div class=muted style="margin-top:5px">영수증 자동 인식 금액 + 직접 수정한 금액 + 추가 금액</div></div>
  <label>사용 내용 / 메모<input id=expMemo value="${old?escapeHtml(old.memo||''):''}" placeholder="선택사항"></label>
  <button class=btn id=saveExpense style="width:100%">${old?'수정 저장':'지출 저장'}</button><div id=expSaveState class=muted style="text-align:center"></div></div></div>`;
  document.body.appendChild(wrap);

  let receiptState=existing;
  const picker=wrap.querySelector('#expReceipts'), list=wrap.querySelector('#expReceiptInputs'), extra=wrap.querySelector('#expExtra'), totalEl=wrap.querySelector('#expTotal'), state=wrap.querySelector('#expSaveState'), saveBtn=wrap.querySelector('#saveExpense');
  let busy=0;
  function calcTotal(){const v=receiptState.reduce((a,r)=>a+Number(r.amount||0),0)+Number(extra.value||0);totalEl.textContent=money(v);return v}
  function updateBusy(delta){busy=Math.max(0,busy+delta);saveBtn.disabled=busy>0;saveBtn.textContent=busy>0?'영수증 처리 중...':(old?'수정 저장':'지출 저장')}
  function drawReceipts(){
    wrap.querySelector('#expReceiptStatus').textContent=`선택된 영수증 ${receiptState.length}장`;
    list.innerHTML=receiptState.length?receiptState.map((r,i)=>`<div class=receipt-card style="display:grid;grid-template-columns:64px 1fr 104px 40px;gap:7px;align-items:center">
      ${String(r.data||'').startsWith('data:image/')?`<img src="${r.data}" style="width:64px;height:64px;object-fit:cover;border-radius:7px;cursor:zoom-in" alt="영수증 ${i+1} - 클릭하면 크게 보기" onclick="openReceiptViewer(this)">`:'<div>🧾</div>'}
      <div style="min-width:0"><b style="font-size:12px;word-break:break-all">${escapeHtml(r.name||('영수증 '+(i+1)))}</b><div class=muted style="font-size:11px;margin-top:3px">${r.ocrStatus==='reading'?`금액 자동 인식 중 ${r.ocrProgress||0}%`:r.ocrStatus==='done'?(Number(r.amount||0)>0?'금액 자동 입력 완료':'자동 인식 실패 · 금액 직접 입력'):r.ocrStatus==='error'?'자동 인식 실패 · 금액 직접 입력':r.ocrStatus==='manual'?'직접 입력':''}</div></div>
      <input class=expRAmt data-i="${i}" type=number inputmode=numeric placeholder="금액" value="${Number(r.amount||0)||''}" style="padding:8px">
      <button type=button class="pill danger expRDel" data-i="${i}" style="padding:8px">×</button>
    </div>`).join(''):'<div class=muted>아직 첨부된 영수증이 없습니다.</div>';
    list.querySelectorAll('.expRAmt').forEach(inp=>inp.oninput=()=>{const i=Number(inp.dataset.i);if(receiptState[i]){receiptState[i].amount=Number(inp.value||0);receiptState[i].ocrStatus='manual';calcTotal()}});
    list.querySelectorAll('.expRDel').forEach(b=>b.onclick=()=>{receiptState.splice(Number(b.dataset.i),1);drawReceipts();calcTotal()});
    calcTotal();
  }

async function prepareReceiptFile(file){

  try{
    const img=await imageFromDataURL(raw);
    const maxSide=1200, scale=Math.min(1,maxSide/Math.max(img.width,img.height));
    const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);

  }catch(e){

let receiptOCRLoader=null;

function receiptAmountFromText(text){
  const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const strong=['합계','총액','총 금액','결제금액','결제 금액','승인금액','승인 금액','받을금액','청구금액','카드금액','현금금액','TOTAL','AMOUNT','GRAND TOTAL','SALE AMOUNT'];
  const weak=['금액','결제','합 계','합계액','판매금액','공급대가'];
  const bad=['사업자','전화','TEL','승인번호','카드번호','가맹점번호','일시','날짜','거래일','영수증번호','포스번호','POS','사업자번호'];
  let cand=[];
  lines.forEach((line,li)=>{
    const up=line.toUpperCase();
    const strongKey=strong.some(k=>up.includes(k.toUpperCase()));
    const weakKey=weak.some(k=>up.includes(k.toUpperCase()));
    const hasBad=bad.some(k=>up.includes(k.toUpperCase()));
    const matches=line.match(/(?:₩|￦|W|KRW)?\s*\d[\d,\.\s]{1,14}(?:\s*원)?/gi)||[];
    matches.forEach(raw=>{
      let digits=raw.replace(/[^0-9]/g,'');
      if(!digits)return;
      let n=Number(digits);
      if(!Number.isFinite(n)||n<100||n>30000000)return;
      if(/^20\d{6}$/.test(digits)||/^20\d{4}$/.test(digits)||/^\d{10,}$/.test(digits))return;
      let score=0;
      if(strongKey)score+=180;
      else if(weakKey)score+=80;
      if(/원|₩|￦|KRW/i.test(raw))score+=35;
      if(/합|총|TOTAL|AMOUNT/i.test(line))score+=50;
      if(hasBad&&!strongKey)score-=120;
      if(/[\/-]/.test(raw)&&digits.length>=6)score-=80;
      // 금액은 보통 100원 단위 이상이며 총액은 줄의 뒤쪽에 있는 경우가 많음
      score+=Math.min(n/50000,30);
      cand.push({n,score,line,li});
    });
  });
  if(!cand.length)return 0;
  cand.sort((a,b)=>b.score-a.score||b.n-a.n);
  if(cand[0].score>=50)return cand[0].n;
  // 키워드를 못 읽은 경우 날짜/전화번호처럼 긴 수를 제외한 가장 큰 금액 후보 사용
  const fallback=cand.filter(x=>String(x.n).length<=8 && x.n<=5000000);
  return fallback.length?Math.max(...fallback.map(x=>x.n)):0;
}
function loadImageData(data){
  return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=data});
}
async function preprocessReceipt(data){
  try{
    const img=await loadImageData(data);
    const maxW=1800, scale=Math.min(2, maxW/Math.max(1,img.width));
    const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,w,h);
    const im=ctx.getImageData(0,0,w,h),d=im.data;
    for(let i=0;i<d.length;i+=4){
      let g=.299*d[i]+.587*d[i+1]+.114*d[i+2];
      // 대비 강화 + 밝은 영수증 배경 정리
      g=Math.max(0,Math.min(255,(g-128)*1.65+150));
      d[i]=d[i+1]=d[i+2]=g;
    }
    ctx.putImageData(im,0,0);
    return c.toDataURL('image/jpeg',.92);
  }catch(e){return data}
}
async function autoReadReceiptAmount(r,onProgress){
  if(!r||!r.data)return 0;
  const isImg=(r.type||'').startsWith('image/')||String(r.data).startsWith('data:image/');
  if(!isImg)return 0;
  const T=await ensureReceiptOCR();
  const input=await preprocessReceipt(r.data);
  // 숫자 인식은 eng가 훨씬 가볍고 안정적이며 한글 키워드가 실패해도 금액 후보로 계산함.
  const result=await T.recognize(input,'eng',{
    logger:m=>{if(onProgress&&m.status==='recognizing text')onProgress(Math.round((m.progress||0)*100))},
    langPath:'https://tessdata.projectnaptha.com/4.0.0'
  });
  return receiptAmountFromText(result?.data?.text||'');
}

  wrap.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:flex;align-items:flex-end;justify-content:center';
  wrap.innerHTML=`<div style="background:white;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px">
    <div class="row between"><div class=section-title>${old?'✏️ 회계 지출 수정':'💳 회계 지출 등록'}</div><button class="pill ghost" id=closeLedgerExpense>닫기</button></div>
    <div class=form>
      <label>날짜<input id=ledDate type=date value="${old?.date||financeSelected||new Date().toLocaleDateString('sv-SE')}"></label>
      <div><b>지출 항목</b><div class=check-grid style="margin-top:8px">${cats.map(c=>`<label class=check-item><input type=checkbox class=ledCat value="${c}" ${(old&&(old.category||'').split(' + ').includes(c))?'checked':''}>${c}</label>`).join('')}</div><input id=ledOther placeholder="기타 항목 직접 입력" style="margin-top:8px"></div>
      <div class=card style="margin:0">
        <b>🧾 영수증 사진</b>
        <div class=muted style="margin:5px 0 9px">휴대폰·컴퓨터 모두 아래 파일 선택창에서 여러 장을 선택할 수 있습니다. 한 번에 한 장만 선택되더라도 다시 눌러 추가하면 기존 사진에 계속 누적됩니다.</div>
        <input id=ledReceipts type=file accept="image/*" multiple style="padding:9px;background:#fff">
        <div id=receiptPickStatus class=muted style="margin-top:7px">선택된 영수증 ${existing.length}장</div>
        <div id=receiptInputs style="display:grid;gap:8px;margin-top:10px"></div>
      </div>
      <label>영수증 외 추가 금액<input id=ledExtra type=number inputmode=numeric value="${existing.length?0:(old?.amount||'')}" placeholder="영수증 없는 비용이 있으면 입력"></label>
      <div class=card style="margin:0"><div class="row between"><b>지출 합계</b><b class=big id=ledTotal>${money(old?.amount||0)}</b></div><div class=muted style="margin-top:5px">영수증에서 인식된 금액 + 직접 수정한 금액 + 추가 금액</div></div>
      <label>메모<input id=ledMemo value="${old?escapeHtml(old.memo||''):''}" placeholder="선택사항"></label>
      <button class=btn id=saveLedgerExpense style="width:100%">${old?'수정 저장':'지출 저장'}</button>
      <div id=saveState class=muted style="text-align:center"></div>
    </div>
  </div>`;
  document.body.appendChild(wrap);

  let receiptState=existing;
  const picker=wrap.querySelector('#ledReceipts'), list=wrap.querySelector('#receiptInputs'), extra=wrap.querySelector('#ledExtra'), totalEl=wrap.querySelector('#ledTotal'), state=wrap.querySelector('#saveState'), saveBtn=wrap.querySelector('#saveLedgerExpense');
  let busy=0;
  function calcTotal(){
    const v=receiptState.reduce((a,r)=>a+Number(r.amount||0),0)+Number(extra.value||0);
    totalEl.textContent=money(v);return v;
  }
  function updateBusy(delta){busy=Math.max(0,busy+delta);saveBtn.disabled=busy>0;saveBtn.textContent=busy>0?'영수증 처리 중...':(old?'수정 저장':'지출 저장')}
  function drawReceipts(){
    wrap.querySelector('#receiptPickStatus').textContent=`선택된 영수증 ${receiptState.length}장`;
    list.innerHTML=receiptState.length?receiptState.map((r,i)=>`<div class=receipt-card style="display:grid;grid-template-columns:64px 1fr 104px 40px;gap:7px;align-items:center">
      ${String(r.data||'').startsWith('data:image/')?`<img src="${r.data}" style="width:64px;height:64px;object-fit:cover;border-radius:7px;cursor:zoom-in" alt="영수증 ${i+1} - 클릭하면 크게 보기" onclick="openReceiptViewer(this)">`:'<div>🧾</div>'}
      <div style="min-width:0"><b style="font-size:12px;word-break:break-all">${escapeHtml(r.name||('영수증 '+(i+1)))}</b><div class=muted style="font-size:11px;margin-top:3px">${r.ocrStatus==='reading'?`금액 자동 인식 중 ${r.ocrProgress||0}%`:r.ocrStatus==='done'?(Number(r.amount||0)>0?'금액 자동 입력 완료':'자동 인식 실패 · 금액 직접 입력'):r.ocrStatus==='error'?'자동 인식 실패 · 금액 직접 입력':r.ocrStatus==='manual'?'직접 입력':''}</div></div>
      <input class=rAmt data-i="${i}" type=number inputmode=numeric placeholder="금액" value="${Number(r.amount||0)||''}" style="padding:8px">
      <button type=button class="pill danger rDel" data-i="${i}" style="padding:8px">×</button>
    </div>`).join(''):'<div class=muted>아직 첨부된 영수증이 없습니다.</div>';
    list.querySelectorAll('.rAmt').forEach(inp=>inp.oninput=()=>{const i=Number(inp.dataset.i);if(receiptState[i]){receiptState[i].amount=Number(inp.value||0);receiptState[i].ocrStatus='manual';calcTotal()}});
    list.querySelectorAll('.rDel').forEach(b=>b.onclick=()=>{receiptState.splice(Number(b.dataset.i),1);drawReceipts();calcTotal()});
    calcTotal();
  }
  drawReceipts();
  extra.oninput=calcTotal;
  wrap.querySelector('#closeLedgerExpense').onclick=()=>wrap.remove();

  picker.addEventListener('change',async()=>{
    const files=[...(picker.files||[])];
    if(!files.length)return;
    updateBusy(1);state.textContent=`영수증 ${files.length}장 불러오는 중...`;
    try{
      const prepared=[];
      await readReceipts(files,x=>prepared.push(...x));
      const start=receiptState.length;
      prepared.forEach(x=>receiptState.push({...x,amount:0,ocrStatus:'reading',ocrProgress:0}));
      drawReceipts();
      state.textContent=`${prepared.length}장 추가 완료 · 금액 자동 인식 중...`;
      picker.value='';
      // OCR은 한 장씩 처리하여 휴대폰 메모리 부담을 줄입니다.
      for(let j=0;j<prepared.length;j++){
        const idx=start+j;
        try{
          const amt=await autoReadReceiptAmount(receiptState[idx],p=>{if(receiptState[idx]){receiptState[idx].ocrProgress=p;drawReceipts()}});
          if(receiptState[idx]){receiptState[idx].amount=amt||0;receiptState[idx].ocrStatus='done';receiptState[idx].ocrProgress=100;drawReceipts()}
        }catch(e){
          if(receiptState[idx]){receiptState[idx].ocrStatus='error';receiptState[idx].ocrError=(e&&e.message)||'OCR 실패';drawReceipts()}
        }
      }
      const ok=receiptState.slice(start).filter(r=>Number(r.amount||0)>0).length;
      state.textContent=`✅ 영수증 ${prepared.length}장 추가 · ${ok}장 금액 자동 입력${ok<prepared.length?' · 나머지는 금액칸에 직접 입력 가능':''}`;
    }catch(e){
      console.error(e);state.textContent='영수증을 불러오지 못했습니다. 다른 사진으로 다시 선택해주세요.';
    }finally{updateBusy(-1);calcTotal()}
  });

  saveBtn.onclick=()=>{
    if(busy)return;
    let cs=[...wrap.querySelectorAll('.ledCat:checked')].map(x=>x.value);
    if(!cs.length)return alert('지출 항목을 선택해주세요.');
    if(cs.includes('기타')){let o=wrap.querySelector('#ledOther').value.trim();cs=cs.filter(x=>x!=='기타');cs.push(o||'기타')}
    const a=calcTotal();if(a<=0)return alert('영수증 금액 또는 추가 금액을 입력해주세요.');
    const date=wrap.querySelector('#ledDate').value,memo=wrap.querySelector('#ledMemo').value.trim();
    saveBtn.disabled=true;saveBtn.textContent='저장 중...';state.textContent='저장하고 있습니다.';
    const item={...(old||{}),id:old?.id||('l'+Date.now()),date,type:'out',category:cs.join(' + '),amount:a,memo,receipts:receiptState,receipt:receiptState[0]?.data||old?.receipt||old?.image||''};
    const prev=index===null?null:db.ledger[index];
    if(old)db.ledger[index]=item;else db.ledger.push(item);
    if(!save()){
      if(old)db.ledger[index]=prev;else db.ledger.pop();
      saveBtn.disabled=false;saveBtn.textContent=old?'수정 저장':'지출 저장';state.textContent='❌ 저장 실패';return;
    }
    state.textContent='✅ 저장 완료';
    setTimeout(()=>{wrap.remove();render();showToast(`✅ 지출 저장 완료 · ${money(a)}`)},250);
  };
}
function editLedger(index){let x=db.ledger[index];if(!x)return;if(x.type==='out')return showLedgerExpenseForm(index);showDepositForm(index)}
function deleteLedger(id,index){if(!confirm('이 장부 기록을 삭제할까요?'))return;if(id)db.ledger=db.ledger.filter(x=>x.id!==id);else db.ledger.splice(index,1);save();render()}
function showDepositForm(index=null){
  const old=index===null?null:db.ledger[index]; if(old&&old.source==='training')return alert('훈련일 지출은 해당 날짜 화면에서 관리해주세요.');
  const members=db.members.filter(x=>x.role==='child');
  const wrap=document.createElement('div');wrap.id='depositModal';wrap.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:flex;align-items:flex-end;justify-content:center';
  wrap.innerHTML=`<div style="background:white;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px"><div class="row between"><div class=section-title>${old?'✏️ 입금 수정':'💰 입금 등록'}</div><button class="pill ghost" id=closeDeposit>닫기</button></div><div class=form>
      <label>입금 날짜<input id=depDate type=date value="${old?.date||financeSelected||new Date().toLocaleDateString('sv-SE')}"></label>
      <div><b>입금한 회원</b><div class=muted>명단의 아이가 자동으로 표시됩니다.</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px">${members.map(x=>`<label style="border:1px solid #dfe4ec;border-radius:10px;padding:10px"><input style="width:auto" type=radio name=depMember value="${x.id}" data-name="${x.name}" ${old?.memberId===x.id?'checked':''}> ${x.name}</label>`).join('')}</div></div>
      <div><b>입금 항목</b><div class=muted>여러 항목을 동시에 체크할 수 있습니다.</div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:8px">${['코칭비','간식비','숙박비','식대','트랙 입장료','기타'].map(x=>`<label style="border:1px solid #dfe4ec;border-radius:10px;padding:10px"><input style="width:auto" type=checkbox class=depCat value="${x}" ${(old&&(old.category||'').split(' + ').includes(x))?'checked':''}> ${x}</label>`).join('')}</div><input id=depOther placeholder="기타 항목 직접 입력" style="margin-top:8px"></div>
      ${old?`<label>입금 금액<input id=depEditAmount type=number inputmode=numeric value="${old.amount||0}"></label>`:`<div><b>금액 빠른 입력</b><div class=muted>중복 체크하면 자동으로 합산됩니다.</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px">${[10000,30000,50000,70000,90000].map(n=>`<label style="border:1px solid #dfe4ec;border-radius:10px;padding:10px;text-align:center"><input style="width:auto" type=checkbox class=depAmt value="${n}"> ${n/10000}만원</label>`).join('')}</div></div><label>추가 금액<input id=depCustom type=number inputmode=numeric placeholder="필요하면 직접 입력"></label>`}
      <div class=card style="margin:0"><div class="row between"><b>입금 합계</b><b class=big id=depTotal>${money(old?.amount||0)}</b></div></div>
      <label>메모<input id=depMemo value="${old?escapeHtml(old.memo||''):''}" placeholder="선택사항"></label>
      <label class="pill ghost" style="text-align:center;cursor:pointer">🧾 영수증 첨부<input id=depReceipt type=file accept="image/*,.pdf" style="display:none"></label><div id=depFileName class=muted>${old&&(old.receipt||old.image)?'기존 영수증이 첨부되어 있습니다.':''}</div>
      <button class=btn id=saveDeposit style="width:100%">${old?'수정 저장':'입금 저장'}</button></div></div>`;
  document.body.appendChild(wrap);
  const total=()=>{let v=old?Number(wrap.querySelector('#depEditAmount').value||0):([...wrap.querySelectorAll('.depAmt:checked')].reduce((a,x)=>a+Number(x.value),0)+Number(wrap.querySelector('#depCustom').value||0));wrap.querySelector('#depTotal').textContent=money(v);return v};
  wrap.querySelectorAll('.depAmt').forEach(x=>x.onchange=total);let custom=wrap.querySelector('#depCustom');if(custom)custom.oninput=total;let editAmount=wrap.querySelector('#depEditAmount');if(editAmount)editAmount.oninput=total;wrap.querySelector('#depReceipt').onchange=e=>wrap.querySelector('#depFileName').textContent=e.target.files[0]?.name||'';wrap.querySelector('#closeDeposit').onclick=()=>wrap.remove();
  wrap.querySelector('#saveDeposit').onclick=()=>{const mem=wrap.querySelector('input[name=depMember]:checked');if(!mem)return alert('입금한 회원을 선택해주세요.');let cats=[...wrap.querySelectorAll('.depCat:checked')].map(x=>x.value);if(cats.includes('기타')){const o=wrap.querySelector('#depOther').value.trim();cats=cats.filter(x=>x!=='기타');cats.push(o||'기타')}if(!cats.length)return alert('입금 항목을 하나 이상 체크해주세요.');const amount=total();if(!amount)return alert('금액을 입력해주세요.');const date=wrap.querySelector('#depDate').value,memo=wrap.querySelector('#depMemo').value.trim(),file=wrap.querySelector('#depReceipt').files[0];readReceipt(file,receipt=>{let item={...(old||{}),id:old?.id||('l'+Date.now()),date,type:'in',category:cats.join(' + '),amount,memo,memberId:mem.value,memberName:mem.dataset.name,receipt:receipt||old?.receipt||old?.image||''};if(old)db.ledger[index]=item;else db.ledger.push(item);save();wrap.remove();render()})};
}
function settings(){el().innerHTML=`<h2>설정 · 백업</h2>
<div class=card><div class=section-title>💾 데이터 저장</div><p>이 앱은 혼자 관리하는 개인용 버전입니다. 일정·명단·출석·입출금·영수증 여러 장이 현재 브라우저에 저장됩니다.</p><p class=muted>휴대폰 변경, 브라우저 초기화에 대비해 아래의 전체 백업 파일을 정기적으로 보관해주세요.</p></div>
<div class=card><div class=section-title>📦 백업 / 복원</div><div class=form><button class=btn onclick=backup()>전체 데이터 백업 파일 받기</button><label class="pill ghost" style="text-align:center;cursor:pointer">백업 파일로 복원<input id=restoreFile type=file accept="application/json,.json" style="display:none" onchange="restore(this.files[0])"></label></div></div>
<div class=card><div class=section-title>🔒 기존 데이터 보호</div><p>현재 입력되어 있는 명단·일정·출석·비용·댓글은 앱을 업데이트해도 그대로 유지됩니다.</p><p class=muted>실수로 전체 기록이 지워지지 않도록 전체 초기화 기능은 제거했습니다.</p></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BMX11-backup-'+new Date().toLocaleDateString('sv-SE')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!x.members||!x.trainings||!x.ledger)throw 0;if(!confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?'))return;db=x;save();alert('복원이 완료되었습니다.');render()}catch(e){alert('BMX11 백업 파일을 확인해주세요.')}};r.readAsText(file)}
function resetAll(){if(confirm('정말 모든 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다.')){db=JSON.parse(JSON.stringify(seed));save();render()}}

render();
</script></body></html>
