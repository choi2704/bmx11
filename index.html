<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BMX11 훈련 · 회계 관리</title>
<style>
:root{--blue:#1769e0;--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#6d778a;--line:#e7ebf2;--green:#12a05c;--yellow:#f3aa18;--red:#ed4d4d}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:680px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:86px}.top{position:sticky;top:0;z-index:4;background:#fff;padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:22px;color:var(--blue)}button{font:inherit;border:0;cursor:pointer}.pill,.btn{border-radius:12px;padding:11px 14px;font-weight:750}.btn{background:var(--blue);color:#fff}.ghost{background:#eef4ff;color:var(--blue)}.danger{background:#fff0f0;color:var(--red)}
main{padding:16px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 14px #1b37610a}.row{display:flex;gap:10px;align-items:center}.between{justify-content:space-between}.muted{color:var(--muted);font-size:13px}.big{font-size:25px;font-weight:900}.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(680px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#fff;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}.tab{background:none;padding:8px 2px;color:#687386;font-size:12px}.tab b{display:block;font-size:20px;margin-bottom:3px}.tab.on{color:var(--blue)}
.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.dow{text-align:center;font-size:12px;color:#7a8496;padding:5px}.day{min-height:78px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:7px;font-size:12px;text-align:left}.day.weekend{background:#fbfcff}.day.has{border:2px solid #b9d3ff}.day .date{font-weight:800}.day .info{font-size:10px;margin-top:8px;color:var(--blue);line-height:1.35}.section-title{font-size:18px;font-weight:900;margin:4px 0 12px}
input,textarea,select{width:100%;border:1px solid #dfe4ec;border-radius:11px;padding:11px;background:#fff;font:inherit}textarea{min-height:78px;resize:vertical}.form{display:grid;gap:9px}.status{display:grid;grid-template-columns:1fr repeat(3,62px);gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.status button{padding:8px 3px;border-radius:9px;background:#f3f5f8;font-size:12px}.status .g.on{background:#dff7e9;color:#087c44}.status .y.on{background:#fff0c9;color:#9a6500}.status .r.on{background:#ffe1e1;color:#b62424}.receipt{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.ledger{padding:10px 0;border-bottom:1px solid var(--line)}.money.in{color:var(--green)}.money.out{color:var(--red)}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.summary>div{border-radius:13px;padding:12px 8px;text-align:center;background:#f6f8fc}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:28px 5px}.comment{padding:10px 0;border-bottom:1px solid var(--line)}.comment-actions{display:flex;gap:6px;margin-top:7px}.comment-actions button{padding:5px 9px;border-radius:8px;font-size:12px}.notice-photo{width:100%;max-height:260px;object-fit:cover;border-radius:12px;border:1px solid var(--line);margin-top:8px}.expense-total{font-size:22px;font-weight:900;color:var(--red)}.check-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.check-item{border:1px solid #dfe4ec;border-radius:10px;padding:10px;background:#fff}.check-item input{width:auto;margin-right:6px}.badge{font-size:12px;padding:5px 8px;border-radius:99px;background:#edf3ff;color:var(--blue)}.finance-day{min-height:66px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;font-size:11px;text-align:left}.finance-day .date{font-weight:800}.finance-day .fin-in{color:var(--green);font-size:9px;margin-top:4px;line-height:1.2}.finance-day .fin-out{color:var(--red);font-size:9px;line-height:1.2}.finance-day.has{border-color:#b9d3ff}.finance-day.on{outline:2px solid var(--blue);background:#f3f7ff}.receipt-link{display:inline-block;margin-top:6px}.finance-filter{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.finance-filter button{padding:8px 11px;border-radius:10px}.finance-filter .on{background:var(--blue);color:#fff}.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:120;background:#14213d;color:#fff;padding:12px 16px;border-radius:12px;font-weight:800;box-shadow:0 6px 24px #0003;max-width:90%;text-align:center}.receipt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.receipt-card{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fafbfe}.receipt-card img{width:100%;height:76px;object-fit:cover;border-radius:8px}.receipt-card a{font-size:12px;word-break:break-all}.receipt-amount{margin-top:6px;font-weight:800;color:var(--red)}
@media(max-width:440px){main{padding:12px}.day{min-height:68px;padding:5px}.day .info{font-size:9px}.status{grid-template-columns:1fr repeat(3,55px)}}
</style>
</head>
<body><div class="app"><header class="top"><div><div class="brand">BMX11</div><div class="muted">주말 훈련 관리</div></div><span class="badge">개인 관리</span></header><main id="main"></main>
<nav class="tabs">
<button class="tab on" data-view="calendar"><b>📅</b>달력</button>
<button class="tab" data-view="members"><b>👥</b>명단</button>
<button class="tab" data-view="finance"><b>💳</b>납부·회계</button>
<button class="tab" data-view="settings"><b>⚙️</b>설정</button>
</nav></div>
<script>
const K='bmx11_final_v1';
const seed={members:[],trainings:{},ledger:[],payments:{},comments:{}};
let db=JSON.parse(localStorage.getItem(K)||'null')||JSON.parse(JSON.stringify(seed)), view='calendar', selected=null;
let financeMonth=todayMonth(), financeSelected='';
// 기존 브라우저에 입력된 데이터는 절대 초기화하지 않고, 새 필드만 보완합니다.
db.members=db.members||[];db.trainings=db.trainings||{};db.ledger=db.ledger||[];db.payments=db.payments||{};db.comments=db.comments||{};
Object.values(db.trainings).forEach(t=>{t.attendance=t.attendance||{};t.expenses=t.expenses||[];t.noticeImages=t.noticeImages||[]});
const save=()=>localStorage.setItem(K,JSON.stringify(db)); const el=()=>document.getElementById('main');
function money(n){return Number(n||0).toLocaleString('ko-KR')+'원'} function todayMonth(){let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`} let month=todayMonth();
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{view=b.dataset.view;selected=null;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));render()});
function render(){if(view==='calendar') calendar(); if(view==='members') members(); if(view==='finance') finance(); if(view==='settings') settings()}
function calendar(){if(selected)return detail(selected); let [y,m]=month.split('-').map(Number), first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();let cells='';for(let i=0;i<first;i++)cells+='<div></div>';for(let d=1;d<=days;d++){let ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,t=db.trainings[ds],wk=[0,6].includes(new Date(y,m-1,d).getDay());cells+=`<button class="day ${wk?'weekend':''} ${t?'has':''}" onclick="selected='${ds}';render()"><div class=date>${d}</div>${t?`<div class=info>${t.time||''}<br>${t.place||''}</div>`:''}</button>`} el().innerHTML=`<div class=month><button class="pill ghost" onclick="shift(-1)">‹</button><div class=big>${y}년 ${m}월</div><button class="pill ghost" onclick="shift(1)">›</button></div><div class=calendar>${['일','월','화','수','목','금','토'].map(x=>`<div class=dow>${x}</div>`).join('')}${cells}</div><button class="btn" style="width:100%;margin-top:14px" onclick="newTraining()">+ 훈련 일정 추가</button>`}
function shift(n){
  const [y,m] = month.split('-').map(Number);
  const totalMonths = y * 12 + (m - 1) + n;
  const newYear = Math.floor(totalMonths / 12);
  const newMonth = ((totalMonths % 12) + 12) % 12 + 1;
  month = `${newYear}-${String(newMonth).padStart(2,'0')}`;
  render();
}
function newTraining(){let d=prompt('훈련 날짜를 입력하세요. 예: 2026-10-10');if(d){db.trainings[d]=db.trainings[d]||{time:'10:00 ~ 13:00',place:'',notice:'',important:'',attendance:{},expenses:[],noticeImages:[]};save();selected=d;render()}}
function detail(d){
  let t=db.trainings[d]||(db.trainings[d]={time:'',place:'',notice:'',important:'',attendance:{},expenses:[],noticeImages:[]});
  t.attendance=t.attendance||{};t.expenses=t.expenses||[];t.noticeImages=t.noticeImages||[];
  let kids=db.members.filter(x=>x.role==='child');
  let possible=kids.filter(x=>t.attendance[x.id]==='g').length;
  let rows=db.members.map(x=>`<div class=status><div><b>${x.name}</b><div class=muted>${x.role==='coach'?'코치':'아이'}</div></div>${['g','y','r'].map((s,i)=>`<button class="${s} ${t.attendance[x.id]===s?'on':''}" onclick="att('${d}','${x.id}','${s}')">${['가능','조정','불가'][i]}</button>`).join('')}</div>`).join('');
  let totalExpense=t.expenses.reduce((a,x)=>a+Number(x.amount||0),0);
  let ex=t.expenses.map((x,i)=>`<div class="ledger row between"><div style="min-width:0"><b>${x.category}</b><div class=muted>${x.memo||''}</div>${x.image?`<img class=receipt src="${x.image}" onclick="window.open(this.src)" title="영수증 크게 보기">`:''}</div><div style="text-align:right;white-space:nowrap"><b class="money out">-${money(x.amount)}</b><br><button class="pill ghost" style="margin-top:7px;padding:6px 9px" onclick="editExpense('${d}',${i})">수정</button> <button class="pill danger" style="margin-top:7px;padding:6px 9px" onclick="deleteExpense('${d}',${i})">삭제</button></div></div>`).join('');
  let noticePhotos=t.noticeImages.map((src,i)=>`<div style="position:relative"><img class=notice-photo src="${src}" onclick="window.open(this.src)"><button class="pill danger" style="position:absolute;right:8px;top:16px;padding:5px 8px" onclick="removeNoticePhoto('${d}',${i})">삭제</button></div>`).join('');
  let comments=(db.comments[d]||[]).map((x,i)=>`<div class=comment><b>${x.author}</b><div>${escapeHtml(x.text)}</div><div class=comment-actions><button class=ghost onclick="editComment('${d}',${i})">수정</button><button class=danger onclick="deleteComment('${d}',${i})">삭제</button></div></div>`).join('');
  el().innerHTML=`<button class="pill ghost" onclick="selected=null;render()">← 달력</button><h2>${d} 훈련</h2>
<div class=card><div class=form><label>훈련 시간<input value="${t.time||''}" onchange="field('${d}','time',this.value)"></label><label>훈련 장소<input value="${t.place||''}" onchange="field('${d}','place',this.value)"></label></div></div>
<div class=card><div class=section-title>📣 코치 공지 / 중요내용</div><textarea placeholder="공지사항" onchange="field('${d}','notice',this.value)">${t.notice||''}</textarea><textarea style="margin-top:8px" placeholder="집합시간, 준비물 등 중요내용" onchange="field('${d}','important',this.value)">${t.important||''}</textarea><label class="pill ghost" style="display:block;text-align:center;margin-top:10px;cursor:pointer">📷 공지 사진 올리기<input type=file accept="image/*" multiple style="display:none" onchange="addNoticePhotos('${d}',this.files);this.value='' "></label>${noticePhotos}</div>
<div class=card><div class="row between"><div class=section-title>👥 참석 현황</div><b>아이 가능 ${possible}명 / ${kids.length}명</b></div>${rows}</div>
<div class=card><div class="row between"><div><div class=section-title>💰 비용</div><div class=expense-total>${money(totalExpense)}</div></div><button class=btn onclick="addExpense('${d}')">+ 지출</button></div>${ex||'<div class=empty>등록된 지출이 없습니다.</div>'}</div>
<div class=card><div class=section-title>💬 댓글</div>${comments}<div class="row" style="margin-top:10px"><input id=comment placeholder="댓글 입력"><button class=btn onclick="comment('${d}')">등록</button></div></div>`
}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function field(d,k,v){db.trainings[d][k]=v;save()} function att(d,id,s){db.trainings[d].attendance[id]=s;save();render()}
function addNoticePhotos(d,files){
  if(!files||!files.length)return;
  const list=[...files]; let done=0;
  list.forEach(f=>{let r=new FileReader();r.onload=()=>{db.trainings[d].noticeImages.push(r.result);done++;if(done===list.length){save();render()}};r.readAsDataURL(f)});
}
function removeNoticePhoto(d,i){if(!confirm('이 공지 사진을 삭제할까요?'))return;db.trainings[d].noticeImages.splice(i,1);save();render()}
function addExpense(d){showExpenseForm(d,null)}
function editExpense(d,i){showExpenseForm(d,i)}
function showExpenseForm(d,index){
  const cats=['간식비','숙박비','코칭비','식대','트랙 입장료','교통·차량비','기타'];
  const old=index===null?null:db.trainings[d].expenses[index];
  const wrap=document.createElement('div');wrap.style.cssText='position:fixed;inset:0;background:#0008;z-index:99;display:flex;align-items:flex-end;justify-content:center';
  wrap.innerHTML=`<div style="background:white;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px"><div class="row between"><div class=section-title>${old?'✏️ 지출 수정':'💳 지출 등록'}</div><button class="pill ghost" id=closeExpense>닫기</button></div><div class=form>
  <div><b>지출 항목</b><div class=muted>체크박스로 선택하세요. 여러 항목도 가능합니다.</div><div class=check-grid style="margin-top:8px">${cats.map(c=>`<label class=check-item><input type=checkbox class=expCat value="${c}" ${(old&&old.category.split(' + ').includes(c))?'checked':''}>${c}</label>`).join('')}</div><input id=expOther placeholder="기타 항목 직접 입력" style="margin-top:8px"></div>
  <label>금액<input id=expAmount type=number inputmode=numeric value="${old?old.amount:''}" placeholder="예: 85000"></label>
  <div class=card style="margin:0"><div class="row between"><b>이번 지출 금액</b><b class=big id=expTotal>${money(old?old.amount:0)}</b></div></div>
  <label>사용 내용 / 메모<input id=expMemo value="${old?escapeHtml(old.memo||''):''}" placeholder="선택사항"></label>
  <label class="pill ghost" style="text-align:center;cursor:pointer">🧾 영수증 파일 첨부<input id=expFile type=file accept="image/*,.pdf" style="display:none"></label>
  <div id=expFileName class=muted>${old&&old.image?'기존 영수증이 첨부되어 있습니다.':''}</div>
  <button class=btn id=saveExpense style="width:100%">${old?'수정 저장':'지출 저장'}</button></div></div>`;
  document.body.appendChild(wrap);
  const amount=wrap.querySelector('#expAmount');amount.oninput=()=>wrap.querySelector('#expTotal').textContent=money(amount.value);
  wrap.querySelector('#closeExpense').onclick=()=>wrap.remove();
  wrap.querySelector('#expFile').onchange=e=>{wrap.querySelector('#expFileName').textContent=e.target.files[0]?.name||''};
  wrap.querySelector('#saveExpense').onclick=()=>{
    let cats=[...wrap.querySelectorAll('.expCat:checked')].map(x=>x.value);if(!cats.length)return alert('지출 항목을 하나 이상 체크해주세요.');
    if(cats.includes('기타')){let o=(wrap.querySelector('#expOther').value||'').trim();cats=cats.filter(x=>x!=='기타');cats.push(o||'기타')}
    let a=Number(amount.value||0);if(a<=0)return alert('금액을 입력해주세요.');let memo=wrap.querySelector('#expMemo').value.trim();let f=wrap.querySelector('#expFile').files[0];
    const finish=image=>{if(old){let id=old.id||('e'+Date.now());db.trainings[d].expenses[index]={...old,id,category:cats.join(' + '),amount:a,memo,image:image||old.image||''};let l=db.ledger.find(x=>x.id===id);if(l)Object.assign(l,{date:d,type:'out',category:cats.join(' + '),amount:a,memo,source:'training'});else db.ledger.push({id,date:d,type:'out',category:cats.join(' + '),amount:a,memo,source:'training'});}else{commitExpense(d,cats.join(' + '),a,memo,image||'')}save();wrap.remove();render()};
    if(f){let r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish(old?.image||'');
  }
}
function commitExpense(d,cat,amount,memo,image){let id='e'+Date.now();db.trainings[d].expenses.push({id,category:cat,amount,memo,image});db.ledger.push({id,date:d,type:'out',category:cat,amount,memo,source:'training'})}
function deleteExpense(d,i){if(!confirm('이 지출과 연결된 장부 기록을 삭제할까요?'))return;let x=db.trainings[d].expenses[i];db.trainings[d].expenses.splice(i,1);if(x.id)db.ledger=db.ledger.filter(l=>l.id!==x.id);save();render()}
function comment(d){let i=document.getElementById('comment');if(!i.value.trim())return;let author=localStorage.getItem('bmx11_name')||prompt('작성자 이름')||'회원';localStorage.setItem('bmx11_name',author);(db.comments[d]||(db.comments[d]=[])).push({author,text:i.value.trim()});save();render()}
function editComment(d,i){let arr=db.comments[d]||[];let v=prompt('댓글 수정',arr[i]?.text||'');if(v===null)return;v=v.trim();if(!v)return alert('댓글 내용을 입력해주세요.');arr[i].text=v;save();render()}
function deleteComment(d,i){if(!confirm('이 댓글을 삭제할까요?'))return;(db.comments[d]||[]).splice(i,1);save();render()}
function members(){let list=db.members.map(x=>`<div class="card row between"><div><b>${x.name}</b><div class=muted>${x.role==='coach'?'코치':'아이'}</div></div><button class="pill danger" onclick="delMember('${x.id}')">삭제</button></div>`).join('');el().innerHTML=`<div class="row between"><h2>명단 관리</h2><button class=btn onclick=addMember()>+ 추가</button></div>${list}`}
function addMember(){let name=prompt('이름');if(!name)return;let role=confirm('코치인가요? 확인=코치 / 취소=아이')?'coach':'child';db.members.push({id:'m'+Date.now(),name,role});save();render()}function delMember(id){if(confirm('현재 명단에서 삭제할까요?')){db.members=db.members.filter(x=>x.id!==id);save();render()}}
function finance(){
  let [y,m]=financeMonth.split('-').map(Number), first=new Date(y,m-1,1).getDay(), days=new Date(y,m,0).getDate();
  let cells='';for(let i=0;i<first;i++)cells+='<div></div>';
  for(let d=1;d<=days;d++){
    let ds=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    let dayRows=db.ledger.filter(x=>x.date===ds), di=dayRows.filter(x=>x.type==='in').reduce((a,b)=>a+Number(b.amount||0),0), doo=dayRows.filter(x=>x.type==='out').reduce((a,b)=>a+Number(b.amount||0),0);
    cells+=`<button class="finance-day ${dayRows.length?'has':''} ${financeSelected===ds?'on':''}" onclick="financeSelected=financeSelected==='${ds}'?'':'${ds}';render()"><div class=date>${d}</div>${di?`<div class=fin-in>+${Number(di).toLocaleString()}</div>`:''}${doo?`<div class=fin-out>-${Number(doo).toLocaleString()}</div>`:''}</button>`;
  }
  let base=financeSelected?db.ledger.filter(x=>x.date===financeSelected):db.ledger;
  let inc=base.filter(x=>x.type==='in').reduce((a,b)=>a+Number(b.amount||0),0),out=base.filter(x=>x.type==='out').reduce((a,b)=>a+Number(b.amount||0),0);
  let rows=[...base].reverse().map(x=>{
    let idx=db.ledger.indexOf(x), receipt=x.receipt||x.image||'', receipts=(x.receipts&&x.receipts.length)?x.receipts:(receipt?[{name:'영수증',data:receipt,type:String(receipt).startsWith('data:image/')?'image/':'' ,amount:x.amount||0}]:[]);

let receiptOCRLoader=null;
function ensureReceiptOCR(){
  if(window.Tesseract)return Promise.resolve(window.Tesseract);
  if(receiptOCRLoader)return receiptOCRLoader;
  receiptOCRLoader=new Promise((resolve,reject)=>{
    const sc=document.createElement('script');
    sc.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    sc.onload=()=>window.Tesseract?resolve(window.Tesseract):reject(new Error('OCR 로드 실패'));
    sc.onerror=()=>reject(new Error('OCR 로드 실패'));
    document.head.appendChild(sc);
  });
  return receiptOCRLoader;
}
function receiptAmountFromText(text){
  const lines=String(text||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const keys=['합계','총액','결제금액','승인금액','받을금액','청구금액','판매금액','카드금액','지불금액','TOTAL','AMOUNT'];
  const bad=['사업자','전화','TEL','승인번호','카드번호','가맹점번호','일시','날짜'];
  let cand=[];
  lines.forEach((line,li)=>{
    const up=line.toUpperCase();
    const hasKey=keys.some(k=>up.includes(k.toUpperCase()));
    const hasBad=bad.some(k=>up.includes(k.toUpperCase()));
    const matches=line.match(/(?:₩|￦)?\s*\d[\d,\.\s]{1,12}(?:\s*원)?/g)||[];
    matches.forEach(raw=>{
      let digits=raw.replace(/[^0-9]/g,'');
      if(!digits)return;
      let n=Number(digits);
      if(!Number.isFinite(n)||n<100||n>10000000)return;
      if(/^20\d{6}$/.test(digits)||/^20\d{4}$/.test(digits))return;
      let score=0;
      if(hasKey)score+=100;
      if(/원|₩|￦/.test(raw))score+=25;
      if(/금액|합계|총액/.test(line))score+=35;
      if(hasBad&&!hasKey)score-=80;
      if(/[-\/.]/.test(raw)&&digits.length>=6)score-=50;
      score+=Math.min(n/100000,20);
      cand.push({n,score,line,li});
    });
  });
  if(!cand.length)return 0;
  cand.sort((a,b)=>b.score-a.score||b.n-a.n);
  if(cand[0].score>=30)return cand[0].n;
  return Math.max(...cand.map(x=>x.n));
}
async function autoReadReceiptAmount(r,onProgress){
  if(!r||!r.data)return 0;

  if(!isImg)return 0;
  const T=await ensureReceiptOCR();
  const result=await T.recognize(r.data,'kor+eng',{logger:m=>{if(onProgress&&m.status==='recognizing text')onProgress(Math.round((m.progress||0)*100))}});
  return receiptAmountFromText(result?.data?.text||'');
}

  wrap.querySelector('#saveDeposit').onclick=()=>{const mem=wrap.querySelector('input[name=depMember]:checked');if(!mem)return alert('입금한 회원을 선택해주세요.');let cats=[...wrap.querySelectorAll('.depCat:checked')].map(x=>x.value);if(cats.includes('기타')){const o=wrap.querySelector('#depOther').value.trim();cats=cats.filter(x=>x!=='기타');cats.push(o||'기타')}if(!cats.length)return alert('입금 항목을 하나 이상 체크해주세요.');const amount=total();if(!amount)return alert('금액을 입력해주세요.');const date=wrap.querySelector('#depDate').value,memo=wrap.querySelector('#depMemo').value.trim(),file=wrap.querySelector('#depReceipt').files[0];readReceipt(file,receipt=>{let item={...(old||{}),id:old?.id||('l'+Date.now()),date,type:'in',category:cats.join(' + '),amount,memo,memberId:mem.value,memberName:mem.dataset.name,receipt:receipt||old?.receipt||old?.image||''};if(old)db.ledger[index]=item;else db.ledger.push(item);save();wrap.remove();render()})};
}

<div class=card><div class=section-title>💾 데이터 저장</div><p>이 앱은 혼자 관리하는 개인용 버전입니다. 일정·명단·출석·입출금·영수증 여러 장이 현재 브라우저에 저장됩니다.</p><p class=muted>휴대폰 변경, 브라우저 초기화에 대비해 아래의 전체 백업 파일을 정기적으로 보관해주세요.</p></div>
<div class=card><div class=section-title>📦 백업 / 복원</div><div class=form><button class=btn onclick=backup()>전체 데이터 백업 파일 받기</button><label class="pill ghost" style="text-align:center;cursor:pointer">백업 파일로 복원<input id=restoreFile type=file accept="application/json,.json" style="display:none" onchange="restore(this.files[0])"></label></div></div>
<div class=card><div class=section-title>🔒 기존 데이터 보호</div><p>현재 입력되어 있는 명단·일정·출석·비용·댓글은 앱을 업데이트해도 그대로 유지됩니다.</p><p class=muted>실수로 전체 기록이 지워지지 않도록 전체 초기화 기능은 제거했습니다.</p></div>`}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='BMX11-backup-'+new Date().toLocaleDateString('sv-SE')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!x.members||!x.trainings||!x.ledger)throw 0;if(!confirm('현재 데이터를 백업 파일 내용으로 바꿀까요?'))return;db=x;save();alert('복원이 완료되었습니다.');render()}catch(e){alert('BMX11 백업 파일을 확인해주세요.')}};r.readAsText(file)}
function resetAll(){if(confirm('정말 모든 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다.')){db=JSON.parse(JSON.stringify(seed));save();render()}}
